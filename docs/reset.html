<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password — The All Block</title>
<meta name="description" content="Choose a new password for your The All Block account.">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://theallblock.com/reset.html">
<link rel="icon" href="/favicon.ico?v=3" sizes="any">
<link rel="icon" href="/img/mark.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap"></noscript>
<style>
/* Same palette and type as the home page — these pages are part of the site,
   not a bolted-on legal annexe. Light only, like index.html. */
:root{
  --paper:#fafafa; --card:#ffffff; --sand:#f2f0ec;
  --ink:#18181a; --ash:#6c6c74; --line:#e5e5ea;
  --lock:#1f9d55; --lock-txt:#177a41;
  --display:"Archivo",system-ui,sans-serif;
  --body:"Montserrat",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --gut:clamp(20px,5vw,64px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:16.5px;line-height:1.7;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:var(--gut)}
a{color:var(--lock-txt)}
a:hover{color:var(--ink)}

/* ── top bar: a way back, nothing more ─────────────────────────────── */
.bar{border-bottom:1px solid var(--line);background:var(--card)}
.bar .wrap{display:flex;align-items:center;gap:14px;
  padding-block:14px;max-width:1180px}
.bar a.home{display:inline-flex;align-items:center;gap:10px;
  text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}
.mark{width:28px;height:28px;flex:none;border-radius:50%;background:var(--ink);
  display:grid;place-items:center}
.mark svg{width:14px;height:14px}
.bar .spacer{flex:1}
.bar .back{text-decoration:none;color:var(--ash);font-size:14px;font-weight:500}
.bar .back:hover{color:var(--ink)}

/* ── the document ──────────────────────────────────────────────────── */
header.doc{padding:clamp(48px,8vw,88px) 0 8px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ash);margin:0 0 14px}
h1{font-family:var(--display);font-weight:800;line-height:.98;margin:0;
  font-variation-settings:"wdth" 112;letter-spacing:-.02em;
  font-size:clamp(34px,6vw,54px)}
.lede{color:var(--ash);font-size:17.5px;margin:18px 0 0;max-width:60ch}
.stamp{font-family:var(--mono);font-size:12.5px;color:var(--ash);
  margin:26px 0 0;padding-top:18px;border-top:1px solid var(--line)}
main{padding-bottom:clamp(60px,10vw,110px)}
section{padding-top:38px}
h2{font-family:var(--display);font-weight:800;font-size:clamp(21px,3vw,26px);
  line-height:1.15;font-variation-settings:"wdth" 112;letter-spacing:-.015em;
  margin:0 0 12px}
h3{font-family:var(--body);font-weight:700;font-size:16.5px;margin:22px 0 6px}
p{margin:0 0 14px}
ul{margin:0 0 14px;padding-left:20px}
li{margin-bottom:8px}
strong,b{font-weight:700}
.callout{background:var(--sand);border:1px solid var(--line);border-radius:16px;
  padding:22px 24px;margin:22px 0}
.callout p:last-child{margin-bottom:0}
.callout--warn{background:#fff;border-left:4px solid var(--lock)}
table{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:15.5px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);
  vertical-align:top}
th{font-weight:700;font-size:13px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ash)}
.overflow{overflow-x:auto}

/* ── footer, mirroring the home page's ─────────────────────────────── */
footer{border-top:1px solid var(--line);background:var(--card);
  padding:34px 0;font-size:13.5px;color:var(--ash)}
footer .in{display:flex;flex-wrap:wrap;gap:10px 26px;
  align-items:center;justify-content:space-between;max-width:1180px}
footer a{color:var(--ash);text-decoration:none}
footer a:hover{color:var(--ink);text-decoration:underline}
.legal-links{display:flex;flex-wrap:wrap;gap:6px 18px}
</style>
</head>
<body>
<main class="doc">
  <p class="eyebrow"><a href="/">The All Block</a></p>
  <h1>Set a new password</h1>

  <!-- GoTrue puts the recovery token in the URL *fragment*, which never
       reaches a server. That is the whole reason this page can be static:
       the token is read in the browser and spent against Supabase directly. -->
  <div id="wrap">
    <p class="lede" id="intro">Choose something you'll remember. You'll use it to sign in inside the app.</p>
    <form id="form">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="6" required>
      <label for="pw2">Repeat it</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="6" required>
      <p class="msg" id="msg" hidden></p>
      <button id="go" type="submit">Save password</button>
    </form>
  </div>
</main>
<style>
  .doc{max-width:460px;margin:0 auto;padding:clamp(60px,10vw,110px) var(--gut,24px);}
  .doc .eyebrow a{color:var(--ash);text-decoration:none}
  .doc h1{font-size:clamp(30px,4vw,40px);margin:0 0 18px}
  .lede{color:var(--ash);margin:0 0 34px}
  label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ash);margin:0 0 8px}
  input{width:100%;box-sizing:border-box;padding:13px 14px;margin:0 0 22px;
    font:inherit;font-size:15px;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:9px}
  input:focus{outline:2px solid var(--lock);outline-offset:1px;border-color:transparent}
  button{width:100%;padding:14px;font:inherit;font-size:15px;font-weight:600;
    color:#fff;background:var(--lock-txt);border:0;border-radius:9px;cursor:pointer}
  button:disabled{opacity:.55;cursor:default}
  .msg{margin:0 0 18px;font-size:14px;line-height:1.6;color:var(--red)}
  .msg.good{color:var(--lock-txt)}
</style>
<script>
(function(){
  var SUPA = "https://jkssypznppzqmdndmssz.supabase.co";
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6" +
             "Imprc3N5cHpucHB6cW1kbmRtc3N6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMDcw" +
             "NjYsImV4cCI6MjEwMjc4MzA2Nn0.ujK9-FfekXhQ_6F2nep47u4K5KU2_Pwyax3Xww-YMMw";
  var $ = function(id){ return document.getElementById(id); };
  var hash = new URLSearchParams(location.hash.replace(/^#/,""));
  var token = hash.get("access_token");

  function say(text, good){
    var m = $("msg"); m.textContent = text; m.hidden = false;
    m.className = good ? "msg good" : "msg";
  }
  if (!token){
    $("form").hidden = true;
    $("intro").textContent = hash.get("error_description") ||
      "This link is missing its token, or it has already been used. Ask for a new one from the app and open the newest email.";
    return;
  }
  // Don't leave a live session token sitting in the address bar or in history.
  history.replaceState(null, "", location.pathname);

  $("form").addEventListener("submit", function(e){
    e.preventDefault();
    var pw = $("pw").value, pw2 = $("pw2").value;
    if (pw.length < 6) return say("Use at least 6 characters.");
    if (pw !== pw2)    return say("Those two don't match.");
    $("go").disabled = true;
    say("Saving…", true);
    fetch(SUPA + "/auth/v1/user", {
      method: "PUT",
      headers: { "apikey": ANON, "Authorization": "Bearer " + token,
                 "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw })
    }).then(function(r){
      return r.json().then(function(b){ return { ok: r.ok, body: b }; });
    }).then(function(r){
      if (!r.ok) throw new Error((r.body && (r.body.msg || r.body.error_description)) ||
                                 "That didn't work. The link may have expired.");
      $("form").hidden = true;
      $("intro").innerHTML = "<b>Password changed.</b> Head back to The All Block and sign in with it.";
    }).catch(function(err){
      $("go").disabled = false;
      say(err.message);
    });
  });
})();
</script>
</body>
</html>
